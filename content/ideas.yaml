# ─────────────────────────────────────────────
# 🌙 Ideas · 想法（随笔、读书笔记）
# 每一篇是一张塔罗牌：背面只显示日期，翻开后显示标题和简介
# 牌上的罗马数字按顺序自动编号（列表最上面的数字最大，所以新写的放在最上面）
#   date:    日期（显示在牌的背面）
#   title:   标题
#   summary: 卡片上显示的一两句
#   file:    全文所在的文件（放在 content/writing/ideas/ 里）。可以是 Word 文档 .docx、Markdown .md 或纯文本 .txt
#            不写 file 就只有卡片，不能点开
# 新写一篇：在 content/writing/ideas/ 里新建一个 .md 文件写正文，再在这里加一张卡片
# ─────────────────────────────────────────────
