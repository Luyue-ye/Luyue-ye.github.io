# ─────────────────────────────────────────────
# 🌙 Creations · 创作（处女座）
# 星座上每一颗亮星是一个分类；点进一颗星，是这个分类的作品列表；点作品名进入正文（自动分页）
# 处女座一共 13 颗主星，所以最多可以有 13 个分类。没用到的星是暗的
#
# 每个分类：
#   id:    分类代号（英文，用在网址里）
#   title: 星星上显示的英文名
#   star:  放在哪颗星上（可选）。可以写：Spica, Porrima, Vindemiatrix, Minelauva, Heze, Zavijava,
#          Zaniah, Rijl al Awwa, Nu Virginis, Omicron Virginis, Syrma, Tau Virginis, Theta Virginis
#          不写的话，会自动放到还空着的最亮的星上
#   items: 这个分类里的作品
#
# 每篇作品：
#   title:   篇名（列表里显示的名字）
#   label:   正文页上方的小字（可选，比如获奖信息、写作时间）
#   file:    全文所在的文件（放在 content/writing/creations/ 里的 .md 文件）
#   summary: 没有 file 时，正文页显示这段简介（可选）
# ─────────────────────────────────────────────
intro: ""
categories:
  - id: "fiction"
    title: "Fiction"
    star: "Spica"
    items:
      - title: "最后的倒计时"
        label: "短篇小说 · 深圳市读书月短篇小说大赛全国第二名"
        file: "content/writing/creations/微小说-最后的倒计时.md"
      - title: "《篇名二》（示例）"
        summary: "作品简介或开头几段。"

  - id: "essays"
    title: "Essays"
    star: "Vindemiatrix"
    items:
      - title: "《散文篇名》（示例）"
        summary: "一段散文的开头。"

  - id: "misc"
    title: "Uncategorized"
    star: "Porrima"
    items:
      - title: "《作品名》（示例）"
        summary: "任何你想展示的创作。"
