sun:
  hello: Hi, I'm Lulu.
  paragraphs:
    - I am a PhD student in Communication at Georgia State University. Welcome
      to my website.
    - My research focuses on diaspora media and cyberpolitics, especially how
      exiled critics from China use digital platforms to reach audiences abroad
      and how their work shapes a transnational public sphere. I am also
      beginning to explore Chinese feminist media and China's green soft power
      in the Nordic countries.
    - This site has two sides. The sun side, where you are now, collects my
      research, conference presentations, publications, and teaching and service
      at GSU. Click *Lulu* at the center of the menu to switch to the moon side.
  zh: 我是佐治亚州立大学传播学博士生。这个网站有日、月两面：太阳记录学术与工作，点击中间的 Lulu，去看看月亮那一面。
  links:
    - label: CV (PDF)
    - label: Email
      url: lye5@student.gsu.edu
    - label: Google Scholar
moon:
  title: Welcome to my other side
  zh_lines:
    - 处女座，INFJ
    - 父母取“美玉”与“璎珞”之意，为我起了中文名字
    - 我的梦想，是成为故事的创造者
    - 将来，想和心爱的人住在海边，养一只狗，一只猫
  en_lines:
    - Virgo, INFJ.
    - My parents drew my Chinese name from fine jade and a jeweled necklace.
    - My dream is to become a creator of stories.
    - Someday I'd like to live by the sea with the one I love, with a dog and a
      cat.
