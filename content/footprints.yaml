# ─────────────────────────────────────────────
# 🌙 Footprints · 足迹星盘
#
# regions：地区，每个地区在星盘上是一个“星座”，也是右边列表的一组
# places：每个地点是一颗星星
#   name:   名字（中文）
#   en:     英文名
#   region: 属于哪个地区（要和上面 regions 里的 name 一样；写一个新名字会自动变成新地区）
#   coords: 坐标，"纬度, 经度"。在 Google 地图上右键点那个地方，第一行就是坐标，直接复制过来
#   note:   可选，卡片上的小标注，比如 家乡
#   home:   可选，写 true 会变成带星芒的大星星
#   photo:  可选，照片，例如 "images/chengdu.jpg"
#   text:   可选，卡片上的一两句话
#
# 同一个地区里，星星按这里的先后顺序连线
# 加一个新地点：复制一段 "- name: ..." 改成新的信息，放到同地区的地点后面
# ─────────────────────────────────────────────
intro: "去过的城市是一颗颗星星，按地区连成星座。拖动可以转动星盘，点一颗星，或在右边选一座城市。"

